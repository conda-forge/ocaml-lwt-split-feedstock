# Local override: gives windows two toolchain lanes (vs/gcc) on x86_64 and
# a zig lane on arm64.
# gcc 15 has no s390x build; s390x stays on gcc 14.
c_compiler:
  - if: not unix and x86_64
    then:
      - vs
      - gcc
  - if: not unix and arm64
    then:
      - zig
c_compiler_version:
  - if: linux and s390x
    then:
      - "14"
